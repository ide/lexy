# Lexy: an Exact app outside the Exact checkout, which it uses by path
# (../../../exact). Build profiles are injected by Exact's scripts; the patches
# below are generated by `exact new` and checked on every run.
[workspace]
members = ["apple", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = "../../../exact/vendor/accesskit-windows" }
taffy = { path = "../../../exact/vendor/taffy" }
parley = { path = "../../../exact/vendor/parley" }
fontique = { path = "../../../exact/vendor/fontique" }
wgpu-hal = { path = "../../../exact/vendor/wgpu-hal" }
