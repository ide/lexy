# The Exact app (exact/lexy) as an ad hoc .ipa: eas.json's `exact` profile,
# whose custom build is .eas/build/exact.yml. Run by hand with
# `eas workflow:run build-exact.yml` (or from the dashboard); pushes never
# start one.
name: Build Lexy on Exact (iOS ad hoc)

on:
  workflow_dispatch: {}

concurrency:
  group: build-exact
  cancel_in_progress: true

jobs:
  build_exact:
    name: Build Lexy.ipa
    type: build
    params:
      platform: ios
      profile: exact
