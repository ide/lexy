mutation ConfirmSubscriptionStatus($vin: String!, $backdoorType: String!) { confirmSubscriptionActive(vin: $vin, payload: { vehicleCapabilities: { backdoorType: $backdoorType }  } ) { vin } }
mutation PostChargeSettings($chargingTargetLimit: Int, $quickChargePowerLimit: Int, $currentCharge: Int) { postChargeSettings(postChargeSettingsInputBody: { chargingTargetLimit: $chargingTargetLimit quickChargePowerLimit: $quickChargePowerLimit currentCharge: $currentCharge } ) { timestamp status { messages { responseCode description detailedDescription } } payload { correlationId returnCode message } } }
mutation PostDriveMonitor($activateProfile: Boolean!, $profileId: String!) { postDriveMonitor(postDMInputBody: { activateProfile: $activateProfile profileId: $profileId } ) { timestamp payload { correlationId } status { messages { responseCode description detailedDescription } } } }
mutation PostPowerSupplyModeLimit($command: String!, $minimumElectricSupply: String) { executeRemoteCommand(commandInputBody: { command: $command minimumElectricSupply: $minimumElectricSupply } ) { payload { requestNo correlationId returnCode } status { messages { responseCode description detailedDescription } } } }
mutation RefreshVehicleStatus($vin: String!) { postRefreshStatus(vin: $vin) { payload { correlationId appRequestNo } status { messages { responseCode description detailedDescription } } timestamp } }
mutation SendPreWakeCommand($guid: String!) { postPreWake(guid: $guid) { timestamp status { messages { responseCode } } } }
mutation SendRemoteCommand($command: String!, $autoFixCommands: [String]!) { executeRemoteCommand(commandInputBody: { command: $command autofixCommands: $autoFixCommands } ) { payload { requestNo correlationId returnCode } status { messages { responseCode description detailedDescription } } } }
