name: Lexy
options:
  bundleIdPrefix: app.ide
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Lexy:
    type: application
    platform: iOS
    sources:
      - Lexy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ide.lexy.swiftui
        PRODUCT_NAME: Lexy
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lexy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: Lexy/Info.plist
      properties:
        LSApplicationQueriesSchemes: [maps, comgooglemaps, waze]
        UILaunchScreen: {}
        CFBundleDisplayName: Lexy
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  LexyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LexyTests
    dependencies:
      - target: Lexy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ide.lexy.swiftui.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lexy.app/Lexy
  LexyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LexyUITests
    dependencies:
      - target: Lexy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ide.lexy.swiftui.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lexy
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Lexy:
    build:
      targets:
        Lexy: all
    test:
      targets:
        - LexyTests
        - LexyUITests
